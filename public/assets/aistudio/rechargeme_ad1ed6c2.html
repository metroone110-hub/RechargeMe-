const ic = (n,s=22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const fmt = n => Math.abs(n).toLocaleString("fr-FR") + "\u00A0F";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digits = s => (s||"").replace(/\D/g,"").slice(0,10);
const pretty = p => p.replace(/(\d{2})(?=\d)/g,"$1 ").trim();
function operator(p){ if(p.length<2) return null; const n=+p.slice(0,2); return n>=1&&n<=3?"Moov":n>=4&&n<=6?"MTN":n>=7&&n<=9?"Orange":null; }
const validPhone = p => p.length===10 && !!operator(p);
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); };
function countUp(el,to){ if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=to.toLocaleString("fr-FR");return;} const t0=performance.now(); (function f(t){ const k=Math.min(1,(t-t0)/900), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e).toLocaleString("fr-FR"); if(k<1) requestAnimationFrame(f); })(t0); }

    <p class="hint" id="h"></p><button class="cta acc" id="go" disabled>Continuer</button></div>`;
  const ph=$("#ph"), btn=$("#go");
  ph.oninput = () => { const d=digits(ph.value); ph.value=pretty(d); const op=operator(d);

    S = {phone:digits(ph.value), balance:7000, tx:[]};

function txRow(t){
  const dd = new Date(t.date), d = dd.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+", "+dd.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  const i = t.amount>0 ? "down" : t.kind==="internet" ? "data" : t.kind==="appels" ? "call" : t.kind==="out" ? "send" : "buy";
  return `<div class="tx"><div class="l"><div class="dot ${t.amount>0?"in":""}">${ic(i,18)}</div><div><b>${esc(t.label)}</b><span>${esc(t.sub)} · ${d}</span></div></div><div class="amt ${t.amount>0?"in":""}">${t.amount>0?"+":"−"}${fmt(t.amount)}</div></div>`;
}
function weekChart(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d;});
  const v=days.map(d=>S.tx.filter(t=>t.amount<0&&new Date(t.date).toDateString()===d.toDateString()).reduce((a,t)=>a-t.amount,0));
  const max=Math.max(...v,1), total=v.reduce((a,b)=>a+b,0);
  return {total, html:`<div class="bars">${days.map((d,i)=>`<div class="bar ${v[i]?"":"z"}" title="${fmt(v[i])}"><i style="--h:${Math.max(6,Math.round(v[i]/max*84))}px;--n:${i}"></i>${d.toLocaleDateString("fr-FR",{weekday:"narrow"})}</div>`).join("")}</div>`};
}

const AMTS = [100,200,500,1000,2000,5000];
function acheter(el){
  const T = buy.type;
  el.innerHTML = `<h1>Acheter</h1><p class="sub">Unités, internet ou appels, pour vous ou un proche.</p>
    <div class="seg">${[["airtime","Unités"],["internet","Internet"],["appels","Appels"]].map(([k,l])=>`<button data-t="${k}" class="${T===k?"on":""}">${l}</button>`).join("")}</div>
    <label for="ph">Numéro à recharger</label>
    <div class="fld"><input id="ph" inputmode="numeric" placeholder="07 00 00 00 00" value="${pretty(buy.phone)}"><span id="o"></span></div>
    <div class="chips" id="rec" style="margin-top:10px"></div><p class="hint" id="h"></p>
    <div id="opts"></div>
    <div class="sticky"><button class="cta acc" id="go" disabled>Acheter</button></div>`;
  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { buy.type=b.dataset.t; buy.amount=0; buy.plan=null; buy.dur="all"; acheter(el); });
  const ph=$("#ph"), opts=$("#opts");
  const recents = [...new Set([S.phone, ...S.tx.map(t=>t.phone).filter(p=>p&&p.length===10)])].slice(0,4);
  $("#rec").innerHTML = recents.map(p=>`<button class="chip" data-p="${p}">${p===S.phone?"Mon numéro":pretty(p)}</button>`).join("");
  $("#rec").querySelectorAll("[data-p]").forEach(c => c.onclick = () => { buy.phone=c.dataset.p; ph.value=pretty(buy.phone); onPhone(true); });
  const price = () => T==="airtime" ? buy.amount : (buy.plan ? buy.plan.price : 0);
  const refresh = () => { const op=operator(buy.phone);
    $("#o").innerHTML = op ? `<span class="op ${op}">${op}</span>` : "";
    $("#h").textContent = buy.phone.length>=2 && !op ? "Numéro ivoirien invalide." : "";
    const p=price(); $("#go").disabled = !(validPhone(buy.phone)&&p>0);
    $("#go").textContent = p ? "Acheter · "+fmt(p).replace("\u00A0"," ") : "Acheter"; };
  const onPhone = full => { const prev=buy.opSeen; buy.opSeen=operator(buy.phone); if(T!=="airtime" && prev!==buy.opSeen){ buy.plan=null; drawPlans(); } refresh(); };
  ph.oninput = () => { buy.phone=digits(ph.value); ph.value=pretty(buy.phone); onPhone(); };
  function drawAir(){
    opts.innerHTML = `<label>Montant</label><div class="chips">${AMTS.map(a=>`<button class="chip ${buy.amount===a?"on":""}" data-a="${a}">${fmt(a)}</button>`).join("")}</div>
      <label for="am">Autre montant (à partir de 100 F)</label><input id="am" inputmode="numeric" placeholder="Ex. 1500" value="${AMTS.includes(buy.amount)||!buy.amount?"":buy.amount}">`;
    opts.querySelectorAll("[data-a]").forEach(c => c.onclick = () => { buy.amount=+c.dataset.a; $("#am").value=""; opts.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c)); refresh(); });
    $("#am").oninput = e => { const v=+digits(e.target.value); buy.amount=v>=100?v:0; opts.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); refresh(); };
  }
  async function drawPlans(){
    const op = operator(buy.phone);
    if(!op){ opts.innerHTML = `<p class="empty">Saisissez un numéro pour voir les forfaits de son opérateur.</p>`; return; }
    opts.innerHTML = `<p class="empty"><span class="spin"></span></p>`;
    const all = await API.plans(op, T);
    if(!all.length){ opts.innerHTML = `<p class="empty">Les forfaits ${op} arrivent bientôt. Vous pouvez déjà acheter des unités.</p>`; return; }
    const B = {all:["Tous",()=>true],c:["1 à 3 jours",p=>p.days<=3],m:["5 à 10 jours",p=>p.days>=5&&p.days<=10],l:["15 jours et +",p=>p.days>=15]};
    const list = all.filter(B[buy.dur][1]);
    opts.innerHTML = `<label>${all.length} forfaits ${op}</label>
      <div class="chips" style="margin-bottom:14px">${Object.entries(B).map(([k,[l]])=>`<button class="chip ${buy.dur===k?"on":""}" data-d="${k}">${l}</button>`).join("")}</div>
      ${list.map((p,i)=>`<button class="plan ${buy.plan&&buy.plan.id===p.id?"on":""}" data-id="${p.id}" style="--n:${i}"><span class="ic">${ic(T==="internet"?"data":"call",20)}</span><span><b>${esc(p.name)}</b><span class="v">${p.valid}</span></span><span class="p">${p.price.toLocaleString("fr-FR")}<small>FCFA</small></span></button>`).join("")||'<p class="empty">Aucun forfait dans cette durée.</p>'}`;
    opts.querySelectorAll("[data-d]").forEach(c => c.onclick = () => { buy.dur=c.dataset.d; drawPlans(); });
    opts.querySelectorAll("[data-id]").forEach(c => c.onclick = () => { buy.plan=all.find(x=>x.id===c.dataset.id); opts.querySelectorAll(".plan").forEach(x=>x.classList.toggle("on",x===c)); refresh(); });
  }
  buy.opSeen = operator(buy.phone);
  T==="airtime" ? drawAir() : drawPlans();
  $("#go").onclick = confirmBuy;
  refresh();
}

function sheet(html){ const o=document.createElement("div"); o.className="ov"; o.innerHTML=`<div class="sheet">${html}</div>`; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); return o; }
function receipt(title, rows, ref){
  const o = sheet(`<svg class="ok" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38"/><path d="M24 41l11 11 21-23"/></svg>
    <h2 style="text-align:center">${title}</h2><div class="sum">${rows.map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join("")}<div class="row"><span>Référence</span><b>${ref}</b></div></div>
    <button class="cta" id="cp">Copier la référence</button><button class="ghost" id="cl">Terminer</button>`);
  o.querySelector("#cl").onclick = () => o.remove();
  o.querySelector("#cp").onclick = () => { try{ navigator.clipboard.writeText(ref); toast("Référence copiée"); }catch(e){ toast(ref); } };
}
function confirmSheet({title, rows, label, run, done}){
  const o = sheet(`<h2>${title}</h2><div class="sum">${rows.map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join("")}</div>
    <button class="cta acc" id="ok">${label}</button><button class="ghost" id="no">Annuler</button>`);
  o.querySelector("#no").onclick = () => o.remove();
  o.querySelector("#ok").onclick = async e => { const b=e.currentTarget; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const r = await run(); o.remove(); if(r.ok) done(r); else toast(r.error||"L’opération a échoué. Réessayez."); };
}

function confirmBuy(){
  const T=buy.type, air=T==="airtime", price=air?buy.amount:buy.plan.price, op=operator(buy.phone);
  if(price > S.balance){ toast("Solde insuffisant. Rechargez votre compte."); return go("recharger"); }
  const name = air ? "Unités "+op : buy.plan.name;
  confirmSheet({ title:"Confirmer l’achat", rows:[["Produit",name],...(air?[]:[["Validité",buy.plan.valid]]),["Numéro",pretty(buy.phone)],["Total",fmt(price)]], label:"Payer "+fmt(price).replace("\u00A0"," "),
    run:() => air ? API.buyAirtime({operator:op,phone:buy.phone,amount:price}) : API.buyPlan({operator:op,phone:buy.phone,plan:buy.plan}),
    done:r => { S.balance-=price; addTx({kind:T,label:name,sub:pretty(buy.phone),phone:buy.phone,amount:-price,ref:r.ref});
      receipt("Achat réussi", [["Produit",name],["Numéro",pretty(buy.phone)],["Total",fmt(price)]], r.ref);
      buy={type:T,phone:"",amount:0,plan:null,dur:"all"}; go("accueil"); route(); } });
}

function transferer(el){
  el.innerHTML = `<h1>Envoyer</h1><p class="sub">Envoyez de l’argent à un autre compte RechargeMe, sans frais.</p>
    <label for="to" style="margin-top:0">Numéro du destinataire</label><div class="fld"><input id="to" inputmode="numeric" placeholder="05 00 00 00 00" value="${pretty(xfer.to)}"><span id="o"></span></div><p class="hint" id="h"></p>

    <div class="sticky"><button class="cta acc" id="go" disabled>Envoyer</button></div>`;
  const refresh = () => { const self=xfer.to===S.phone, op=operator(xfer.to);
    $("#o").innerHTML = op ? `<span class="op ${op}">${op}</span>` : "";
    $("#h").textContent = self ? "Vous ne pouvez pas vous envoyer de l’argent." : (xfer.to.length>=2&&!op ? "Numéro ivoirien invalide." : "");
    $("#go").disabled = !(validPhone(xfer.to)&&!self&&xfer.amount>=100); };
  $("#to").oninput = e => { xfer.to=digits(e.target.value); e.target.value=pretty(xfer.to); refresh(); };

function historique(el){
  const now=new Date(), m=S.tx.filter(t=>{const d=new Date(t.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const spent=m.filter(t=>t.amount<0).reduce((a,t)=>a-t.amount,0), added=m.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const flt={all:()=>true,in:t=>t.amount>0,out:t=>t.amount<0}, list=S.tx.filter(flt[filter]), w=weekChart();
  el.innerHTML = `<h1>Historique</h1><p class="sub">Vos dépenses et recharges.</p>
    <div class="stat"><div><span>Dépensé ce mois</span><b>${fmt(spent)}</b></div><div><span>Rechargé ce mois</span><b>${fmt(added)}</b></div></div>
    <section class="card"><h2>7 derniers jours</h2>${w.html}</section>
    <div class="chips" style="margin:4px 0">${[["all","Tout"],["out","Dépenses"],["in","Entrées"]].map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
    <div class="list">${list.length?list.map(txRow).join(""):'<p class="empty">Rien à afficher pour ce filtre.</p>'}</div>`;
  el.querySelectorAll("[data-f]").forEach(c => c.onclick = () => { filter=c.dataset.f; historique(el); });
}

};
const PM = [[SOLDE,"#000"],["Wave","#1fb6ff"],["MTN Money","#ffcc00"],["Orange Money","#ff7900"],["Moov Money","#0b63ce"]];
const SUPPORT = "2250000000000";   // TODO : numéro WhatsApp du support
const FAQ = [["Quels moyens de paiement ?","Wave, MTN Money, Orange Money, Moov Money, ou votre solde RechargeMe."],["En combien de temps je reçois mon pass ?","En général en quelques secondes. Cela dépend aussi de l’opérateur."],["Puis-je recharger le numéro d’un proche ?","Oui. Saisissez son numéro à l’étape d’achat : l’opérateur est reconnu automatiquement."],["Mon achat n’est pas arrivé, que faire ?","Contactez le support avec la référence affichée sur votre reçu."]];
const faqHtml = () => FAQ.map(([q,a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");

function confirmSheet({title, rows, label, run, done, pay, total}){
  let pm = pay ? (S.balance>=total ? SOLDE : "Wave") : null, payer = S.phone;
  const o = sheet(`<h2>${title}</h2><div class="sum">${rows.map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join("")}</div>${pay?`<label style="margin:0 0 8px">Payer avec</label><div class="pay">${PM.map(([n,c])=>`<button class="po" data-m="${n}" ${n===SOLDE&&S.balance<total?"disabled":""}><span>${LOGO[n]}${n}</span><small>${n===SOLDE?(S.balance<total?"Solde insuffisant":fmt(S.balance)):""}</small></button>`).join("")}</div><div id="pn"></div>`:""}<button class="cta acc" id="ok" style="margin-top:18px">${label}</button><button class="ghost" id="no">Annuler</button>`);
  const ok = o.querySelector("#ok");
  const sync = () => {
    o.querySelectorAll(".po").forEach(b => b.classList.toggle("on", b.dataset.m===pm));
    if(!pay) return;
    o.querySelector("#pn").innerHTML = pm!==SOLDE ? `<label>Numéro ${pm} qui paie</label><input id="py" inputmode="numeric" value="${pretty(payer)}">` : "";
    const py = o.querySelector("#py");
    if(py) py.oninput = () => { payer=digits(py.value); py.value=pretty(payer); ok.disabled=!validPhone(payer); };
    ok.disabled = pm!==SOLDE && !validPhone(payer);
  };
  o.querySelectorAll(".po").forEach(b => b.onclick = () => { pm=b.dataset.m; sync(); });
  sync();
  o.querySelector("#no").onclick = () => o.remove();
  ok.onclick = async () => { ok.disabled=true; ok.innerHTML='<span class="spin"></span>'; const r = await run(pm,payer); o.remove(); if(r.ok) done(r,pm); else toast(r.error||"L’opération a échoué. Réessayez."); };
}

function confirmBuy(){
  const T=buy.type, air=T==="airtime", price=air?buy.amount:buy.plan.price, op=operator(buy.phone), name=air?"Unités "+op:buy.plan.name;
  const base = [["Produit",name],...(air?[]:[["Validité",buy.plan.valid]]),["Numéro",pretty(buy.phone)],["Total",fmt(price)]];
  confirmSheet({ title:"Confirmer l’achat", rows:base, label:"Payer "+fmt(price).replace("\u00A0"," "), pay:true, total:price,
    run:(pm,payer) => air ? API.buyAirtime({operator:op,phone:buy.phone,amount:price,payWith:pm,payer}) : API.buyPlan({operator:op,phone:buy.phone,plan:buy.plan,payWith:pm,payer}),
    done:(r,pm) => { if(pm===SOLDE) S.balance-=price;
      addTx({kind:T,label:name,sub:pretty(buy.phone)+" ("+pm+")",phone:buy.phone,amount:-price,ref:r.ref});
      receipt("Achat réussi",[...base,["Paiement",pm]],r.ref);
      buy={type:T,phone:"",amount:0,plan:null,dur:"all"}; go("accueil"); route(); } });
}

function accueil(el){
  const w = weekChart(), op = operator(S.phone);
  const pick = (k,ps) => ps.map(p => mk(op,k).find(x=>x.price===p)).filter(Boolean);
  const L = [...pick("internet",[200,500,1000,2500,5000]), ...pick("appels",[1000,5000])];
  el.innerHTML = `<section class="hero"><div class="lbl"><span>Votre solde</span><button class="eye" id="eye">${S.hide?"Afficher":"Masquer"}</button></div>
    <div class="bal"><span id="n">${S.hide?"••••":"0"}</span><small>F CFA</small></div>
    <div class="acts"><button data-go="recharger">${ic("plus")}Recharger</button><button data-go="acheter">${ic("buy")}Acheter</button><button data-go="transferer">${ic("send")}Envoyer</button></div></section>
    ${L.length?`<div class="row"><h2>Offres pour votre ${op}</h2></div><div class="hs">${L.map((p,i)=>`<button class="of" data-i="${i}"><span>${p.kind==="internet"?"Internet":"Appels"}, ${p.valid}</span><b>${esc(p.name.length>34?p.name.slice(0,32)+"…":p.name)}</b><div class="big">${p.price.toLocaleString("fr-FR")} F</div></button>`).join("")}</div>`:""}
    <section class="card"><div class="row"><h2>Dépenses, 7 derniers jours</h2><b>${fmt(w.total)}</b></div>${w.html}</section>
    <div class="row"><h2>Dernières opérations</h2><button class="link" data-go="historique">Tout voir</button></div>
    <div class="list">${S.tx.length ? S.tx.slice(0,5).map(txRow).join("") : '<p class="empty">Aucune opération. Rechargez votre compte pour commencer.</p>'}</div>`;
  if(!S.hide) countUp($("#n"), S.balance);
  $("#eye").onclick = () => { S.hide=!S.hide; save(); accueil(el); };
  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { const p=L[+b.dataset.i]; buy={type:p.kind,phone:S.phone,amount:0,plan:p,dur:"all"}; go("acheter"); });
}

function compte(el){
  const op = operator(S.phone), sp = S.tx.filter(t=>t.amount<0).reduce((a,t)=>a-t.amount,0);
  el.innerHTML = `<h1>Compte</h1><p class="sub">Vos informations et l’aide.</p>
    <section class="card"><div class="row"><div><b style="font-size:20px">${pretty(S.phone)}</b><div class="hint" style="margin:0">Numéro principal</div></div><span class="op ${op}">${op}</span></div></section>
    <div class="stat"><div><span>Opérations</span><b>${S.tx.length}</b></div><div><span>Total dépensé</span><b>${fmt(sp)}</b></div></div>
    <h2 style="margin:22px 0 4px">Aide</h2>${faqHtml()}
    <a class="cta acc" style="margin-top:22px" href="https://wa.me/${SUPPORT}" target="_blank" rel="noopener">Écrire au support</a>
    <button class="ghost" id="lo">Se déconnecter</button>`;
  $("#lo").onclick = () => { S=null; store.set("rechargeme",null); route(); };
}

const landing = () => {
  const cnt = o => CATALOG[o].internet.length + CATALOG[o].appels.length;
  return `<div class="land">
    <h2 class="lh">Comment ça marche</h2>
    ${[["Créez votre compte","Un numéro de téléphone suffit."],["Choisissez votre pass","Unités, internet ou appels pour Orange, MTN et Moov."],["Payez comme vous voulez","Wave, MTN Money, Orange Money, Moov Money ou votre solde."]].map((s,i)=>`<div class="st"><b>${i+1}</b><div><h3>${s[0]}</h3><p>${s[1]}</p></div></div>`).join("")}
    <h2 class="lh">Tous les opérateurs</h2>
    <div class="ops">${["Orange","MTN","Moov"].map(o=>`<div class="oc"><span class="op ${o}" style="animation:none">${o}</span><b>${cnt(o)}</b><small>forfaits</small></div>`).join("")}</div>
    <h2 class="lh">Pourquoi RechargeMe</h2>
    <div class="adv">${[["Un seul compte","Rechargez n’importe quel numéro, sans changer d’application."],["Paiement mobile money","Wave et les trois mobile money acceptés à chaque achat."],["Reçu à chaque achat","Gardez une référence et retrouvez vos opérations dans l’historique."],["Envois sans frais","Envoyez de l’argent à vos proches inscrits sur RechargeMe."]].map(a=>`<div><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join("")}</div>
    <h2 class="lh">Questions fréquentes</h2>${faqHtml()}
    <p class="foot">© 2026 RechargeMe, Abidjan</p></div>`;
};

function renderLogin(){
  root.innerHTML = `<div class="login view"><div class="logo">RechargeMe<i></i></div>
    <div class="float"><span class="op Orange">Orange</span><span class="op MTN">MTN</span><span class="op Moov">Moov</span></div>
    <h1>Unités et data, en quelques secondes.</h1><p class="sub">Entrez votre numéro pour ouvrir votre compte.</p>
    <label for="ph" style="margin-top:0">Numéro de téléphone</label>
    <div class="fld"><input id="ph" inputmode="numeric" autocomplete="tel" placeholder="07 00 00 00 00"><span id="o"></span></div>
    <p class="hint" id="h"></p><button class="cta acc" id="go" disabled>Continuer</button></div>${landing()}`;
  const ph=$("#ph"), btn=$("#go");
  ph.oninput = () => { const d=digits(ph.value); ph.value=pretty(d); const op=operator(d);
    $("#o").innerHTML = op ? `<span class="op ${op}">${op}</span>` : "";
    $("#h").textContent = d.length>=2 && !op ? "Ce numéro n’est pas un numéro ivoirien valide." : "";
    btn.disabled = !validPhone(d); };
  btn.onclick = async () => {
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    const r = await API.login(digits(ph.value));
    if(!r.ok){ toast(r.error||"Connexion impossible"); btn.disabled=false; btn.textContent="Continuer"; return; }
    S = {phone:digits(ph.value), balance:7000, tx:[]};
    const ago = d => new Date(Date.now()-d*864e5).toISOString();   // historique de démonstration
    S.tx = [{kind:"out",label:"Pass c’chic 1,5 Go",sub:"05 00 00 00 00",amount:-1500,date:ago(1)},{kind:"out",label:"Unités Orange",sub:"07 00 00 00 00",amount:-500,date:ago(2)},{kind:"out",label:"Internet 3 Jours",sub:"05 00 00 00 00",amount:-1000,date:ago(4)},{kind:"in",label:"Recharge du compte",sub:"Wave (démo)",amount:10000,date:ago(6)}].map((t,i)=>({id:i,phone:t.sub.replace(/\D/g,""),...t}));
    save(); location.hash="accueil"; route();
  };
}
route();
})();
</script>
